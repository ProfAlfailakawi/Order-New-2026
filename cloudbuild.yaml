steps:
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['install', '--no-audit', '--no-fund']

  - name: 'node:22'
    entrypoint: 'npm'
    args: ['run', 'build']

  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --project=gen-lang-client-0200723670 --only hosting

options:
  logging: CLOUD_LOGGING_ONLY