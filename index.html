<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#183326" />
    <!-- Fonts load in parallel with the app bundle (was a serial @import inside CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" />
    <!-- Splash logo paints instantly on first visit -->
    <link rel="preload" as="image" href="/logo-optimized.png" />
    <link rel="icon" type="image/png" href="/apple-touch-icon-v7.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v7.png" />
    <link rel="manifest" href="/manifest.json?v=9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="التراث" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>شركة مطبخ التراث الكويتي</title>
    <meta name="description" content="طعم الأصالة في كل طبق، نقدّم لكم أشهى الأكلات الكويتية الأصيلة. اطلب الآن واستمتع بالطعم الحقيقي." />
    <!-- Canonical URL for SEO and consistent link sharing -->
    <link rel="canonical" href="https://alturathkw.shop/" />
    
    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:title" content="شركة مطبخ التراث الكويتي" />
    <meta property="og:description" content="طعم الأصالة في كل طبق، نقدّم لكم أشهى الأكلات الكويتية الأصيلة. اطلب الآن واستمتع بالطعم الحقيقي." />
    <!-- Warm custom Open Graph image for WhatsApp / social previews -->
    <meta property="og:image" content="https://alturathkw.shop/og-order-v8.jpg" />
    <meta property="og:url" content="https://alturathkw.shop/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="شركة مطبخ التراث الكويتي" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="شركة مطبخ التراث الكويتي" />
    <meta name="twitter:description" content="طعم الأصالة في كل طبق، نقدّم لكم أشهى الأكلات الكويتية الأصيلة. اطلب الآن واستمتع بالطعم الحقيقي." />
    <meta name="twitter:image" content="https://alturathkw.shop/og-order-v8.jpg" />
    <style>
      html, body {
        touch-action: pan-x pan-y; /* Prevent pinch zoom but allow scrolling */
        overscroll-behavior: none;
      }
    </style>
    <script>
      // Prevent double tap to zoom in iOS Safari
      document.addEventListener('dblclick', function(event) {
        event.preventDefault();
      }, { passive: false });
      
      // Prevent pinch to zoom in iOS Safari
      document.addEventListener('gesturestart', function(event) {
        event.preventDefault();
      });
      document.addEventListener('gesturechange', function(event) {
        event.preventDefault();
      });
      document.addEventListener('gestureend', function(event) {
        event.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root">
      <!-- First-paint branded splash: cream ground + centered logo.
           Visually matches the React splash so the handover is seamless.
           React replaces #root's children on mount. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#fff7e8;">
        <div style="width:120px;height:120px;border-radius:28px;background:#fff;box-shadow:0 18px 48px rgba(24,51,38,0.14);display:flex;align-items:center;justify-content:center;overflow:hidden;">
          <img src="/logo-optimized.png" alt="شركة مطبخ التراث الكويتي" style="width:100%;height:100%;object-fit:contain;padding:12px;box-sizing:border-box;" />
        </div>
        <div style="width:150px;height:6px;border-radius:999px;background:#ead8b5;overflow:hidden;">
          <div style="width:50%;height:100%;border-radius:999px;background:linear-gradient(to left,#0f3d2e,#d7a642,#ba3f31);animation:bootSlide 1.2s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>@keyframes bootSlide{0%{transform:translateX(-120%)}100%{transform:translateX(240%)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
