<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#183326" />
    <link rel="icon" type="image/png" href="/apple-touch-icon-v4.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v4.png" />
    <link rel="manifest" href="/manifest.json?v=8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>شركة مطبخ التراث الكويتي</title>
    <style>
      html, body {
        touch-action: pan-x pan-y; /* Prevent pinch zoom but allow scrolling */
        overscroll-behavior: none;
      }
    </style>
    <script>
      // Prevent double tap to zoom in iOS Safari
      document.addEventListener('dblclick', function(event) {
        event.preventDefault();
      }, { passive: false });
      
      // Prevent pinch to zoom in iOS Safari
      document.addEventListener('gesturestart', function(event) {
        event.preventDefault();
      });
      document.addEventListener('gesturechange', function(event) {
        event.preventDefault();
      });
      document.addEventListener('gestureend', function(event) {
        event.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
