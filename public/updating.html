<!doctype html>
<!--
  صفحة «المطبخ يتهيّأ» (تحديث المتجر).

  أثناء نشر خادم الطلبات (Cloud Run) تجيب واجهةُ Google الأماميّة بصفحة خطأٍ
  إنجليزية (500/502/503/504) لا يكتبها خادمُنا. عاملُ الخدمة (public/sw.js) يحفظ
  هذه الصفحة عند تثبيته، ويقدّمها بدلاً من ذلك الجواب أو من انقطاع التنقّل —
  والرابطُ في شريط العنوان يبقى ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.
  مسارُ الدفع (?payment= و?checkout= و/track و/split) لا يمرّ بهذه الصفحة أبداً.

  الشكل: تذكرةُ مطبخٍ ورقية (حوافّ مثقّبة، صفوفٌ بخطٍّ منقّط كفاتورة المتجر) فيها
  دلّةٌ مرسومة بخطٍّ واحد يتصاعد منها البخار، وشريطُ سدوٍ بعرض الشاشة في أسفلها —
  من ألوان هوية «النول» في src/identity.css.

  مستقلّةٌ تماماً: لا طلبَ إلى نطاقٍ آخر، والخطّان من خطوط الموقع المحفوظة عندنا
  (Reem Kufi للعنوان وTajawal للقراءة) وإلا خطُّ النظام. تسأل /api/health كل ثلاث
  ثوانٍ (وتتباطأ تدريجياً)، فإذا أجاب أعادت فتح الصفحة المطلوبة. وإن عادت الصفحةُ
  تتعثّر والخادمُ سليم ثلاثَ مرّاتٍ في دقيقتين، تباطأت إلى مرّةٍ كل نصف دقيقة ولا
  تدور في حلقة.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="updating-page" content="1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fff7e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1a13" media="(prefers-color-scheme: dark)">
<title>المطبخ يتهيّأ · مطبخ التراث الكويتي</title>
<style>
@font-face{font-family:"Tajawal Local";font-weight:400;font-display:swap;src:local("Tajawal"),local("Tajawal-Regular"),url("/fonts/766bb6d148.woff2") format("woff2")}
@font-face{font-family:"Tajawal Local";font-weight:700;font-display:swap;src:local("Tajawal Bold"),local("Tajawal-Bold"),url("/fonts/219658d1f2.woff2") format("woff2")}
@font-face{font-family:"Reem Kufi Loom";font-weight:400 700;font-display:swap;src:url("/fonts/reem-kufi-arabic-wght-normal.woff2") format("woff2")}
:root{
  --bg:#fff7e8;--paper:#fffaf0;--ink:#12301f;--muted:#5b564f;--seam:rgb(18 48 31 / .16);--dots:rgb(18 48 31 / .28);
  --saffron:#c8942f;--saffron-ink:#7a5614;--madder:#a9262b;--palm:#12301f;--steam:#b9a98a;
  --btn:#12301f;--btn-ink:#fff8e6;--shadow:0 24px 60px -28px rgba(63,45,20,.38),0 2px 0 rgba(63,45,20,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c1a13;--paper:#13261c;--ink:#f7efde;--muted:#c2b9a3;--seam:rgb(247 239 222 / .12);--dots:rgb(247 239 222 / .26);
    --saffron:#e7bf5e;--saffron-ink:#e7bf5e;--madder:#c9454a;--palm:#2f6b4a;--steam:#8f9a86;
    --btn:#e7bf5e;--btn-ink:#12301f;--shadow:0 30px 70px -30px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:"Tajawal Local","Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;text-align:start;
}
.room{flex:1;display:flex;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 16px 36px}

/* ---------- تذكرة المطبخ ---------- */
.ticket{
  position:relative;width:100%;max-width:400px;padding:30px 22px 24px;
  background:var(--paper);border-radius:6px;box-shadow:var(--shadow);
  transform:rotate(-.4deg);
}
/* حوافّ مثقّبة أعلى التذكرة وأسفلها، كورقة طلبٍ قُطعت من دفتر المطبخ */
.ticket::before,.ticket::after{
  content:"";position:absolute;inset-inline:0;height:10px;
  background:radial-gradient(circle at 9px 50%,var(--bg) 4.2px,transparent 4.8px) 0 0/18px 10px repeat-x;
}
.ticket::before{top:-5px}
.ticket::after{bottom:-5px}
.kicker{display:flex;align-items:center;gap:8px;margin:0;font-size:12px;font-weight:700;color:var(--saffron-ink);letter-spacing:0}
.kicker::after{content:"";flex:1;border-top:1px dashed var(--seam)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
h1{margin:0;font-family:"Reem Kufi Loom","Tajawal Local","Tajawal",sans-serif;font-size:clamp(25px,7vw,30px);font-weight:700;line-height:1.45;letter-spacing:0}
.lead{margin:10px 0 0;font-size:15.5px;line-height:1.8;color:var(--muted)}

/* الدلّة: خطٌّ واحد بلون الحبر، والبخار يتصاعد من فم الدلّة */
.dallah{flex:none;width:96px;height:112px;margin-block-end:-6px;color:var(--ink)}
.dallah .line{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dallah .belt{fill:none;stroke:var(--saffron);stroke-width:2.2;stroke-dasharray:3 4;stroke-linecap:round}
.dallah .ember{fill:var(--madder)}
.steam path{fill:none;stroke:var(--steam);stroke-width:2.2;stroke-linecap:round;opacity:0;stroke-dasharray:40;stroke-dashoffset:40;animation:rise 3.4s ease-out infinite}
.steam path:nth-child(2){animation-delay:1.1s}
.steam path:nth-child(3){animation-delay:2.2s}

/* صفوف الفاتورة: عنوانٌ، نقاطٌ، قيمة */
.rows{margin:18px 0 0;padding:14px 0 2px;border-top:1.5px dashed var(--dots);display:grid;gap:10px}
.row{display:flex;align-items:baseline;gap:8px;font-size:14px;line-height:1.6}
.row dt{flex:1;display:flex;align-items:baseline;gap:8px;color:var(--muted);font-weight:400}
.row dt::after{content:"";flex:1;min-width:16px;border-bottom:2px dotted var(--dots);transform:translateY(-4px)}
.row dd{margin:0;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px}
.simmer{width:8px;height:8px;border-radius:2px;background:var(--madder);transform:rotate(45deg);animation:simmer 1.6s ease-in-out infinite}
.note{min-height:22px;margin:16px 0 0;padding-top:14px;border-top:1.5px dashed var(--dots);font-size:13px;line-height:1.7;color:var(--muted)}
button{
  display:block;width:100%;min-height:48px;margin-top:14px;padding:0 20px;border-radius:18px;cursor:pointer;
  border:0;background:var(--btn);color:var(--btn-ink);
  font:inherit;font-size:15px;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(231,191,94,.35),0 12px 24px -16px rgba(18,48,31,.8);
  transition:transform .16s cubic-bezier(.22,.78,.24,1),filter .2s ease;
}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}

/* ---------- شريط السدو بعرض الشاشة ---------- */
.sadu{flex:none;height:40px;padding-bottom:env(safe-area-inset-bottom);background:var(--palm);display:flex;flex-direction:column;justify-content:center;gap:3px}
.sadu i{display:block;height:2px;background:repeating-linear-gradient(90deg,var(--saffron) 0 6px,transparent 6px 10px)}
.sadu b{
  display:block;height:18px;
  background:
    linear-gradient(135deg,var(--palm) 25%,transparent 25%) 0 0/18px 18px,
    linear-gradient(225deg,var(--palm) 25%,transparent 25%) 0 0/18px 18px,
    linear-gradient(315deg,var(--palm) 25%,transparent 25%) 0 0/18px 18px,
    linear-gradient(45deg,var(--palm) 25%,transparent 25%) 0 0/18px 18px,
    linear-gradient(90deg,var(--madder) 50%,#e7bf5e 50%) 0 0/36px 18px;
}

@keyframes rise{
  0%{opacity:0;stroke-dashoffset:40;transform:translateY(6px)}
  25%{opacity:.95}
  100%{opacity:0;stroke-dashoffset:0;transform:translateY(-10px)}
}
@keyframes simmer{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(.7)}}
@media (prefers-reduced-motion:reduce){
  .steam path,.simmer{animation:none}
  .steam path{opacity:.7;stroke-dashoffset:0}
}
@media (min-width:720px){
  .ticket{padding:36px 30px 28px}
  .dallah{width:118px;height:138px}
}
</style>
</head>
<body>
<div class="room">
  <main class="ticket">
    <p class="kicker">مطبخ التراث الكويتي</p>
    <div class="head">
      <h1 id="title">المطبخ يتهيّأ لكم</h1>
      <!-- دلّةٌ بخطٍّ واحد: الغطاء والرقبة والبطن والمقبض والمنقار، وجمرةٌ تحتها. -->
      <svg class="dallah" viewBox="0 0 120 140" aria-hidden="true" focusable="false">
        <g class="steam">
          <path d="M14 34c-5-6 5-9 0-16s4-9 1-14"/>
          <path d="M24 38c-4-6 4-9 0-15s3-8 1-12"/>
          <path d="M60 14c-4-5 4-8 0-13"/>
        </g>
        <path class="line" d="M60 18v4"/>
        <path class="line" d="M51 33l9-11 9 11z"/>
        <path class="line" d="M47 34h26"/>
        <path class="line" d="M51 34c0 8 4 12 4 18c-14 7-21 22-19 42c2 14 10 20 24 20s22-6 24-20c2-20-5-35-19-42c0-6 4-10 4-18"/>
        <path class="line" d="M55 52h10"/>
        <path class="belt" d="M39 90h42"/>
        <path class="line" d="M44 114l-3 9h38l-3-9"/>
        <path class="line" d="M38 80c-12-6-18-22-24-38l-6-3"/>
        <path class="line" d="M41 72c-9-6-15-18-20-30"/>
        <path class="line" d="M8 39l6 3h7"/>
        <path class="line" d="M84 62c17 1 20 32 0 40"/>
        <path class="ember" d="M60 128l4 4-4 4-4-4z"/>
      </svg>
    </div>
    <p class="lead" id="lead">نُحدّث المتجر الآن، وصفحة طلبك تعود إليك وحدها بعد قليل.</p>
    <dl class="rows">
      <div class="row"><dt>الحالة</dt><dd><span class="simmer" aria-hidden="true"></span><span id="state">على النار</span></dd></div>
      <div class="row"><dt>صفحتك</dt><dd>محفوظة كما طلبتها</dd></div>
      <div class="row"><dt>العودة</dt><dd>تلقائية</dd></div>
    </dl>
    <p class="note" id="note" role="status" aria-live="polite">نُبقي القِدر على النار، ونفتح لك الصفحة التي طلبتها حين تجهز.</p>
    <button type="button" id="retry">أعد طلب الصفحة الآن</button>
  </main>
</div>
<div class="sadu" aria-hidden="true"><i></i><b></b><i></i></div>
<script>
(function () {
  var HEALTH = "/api/health";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "alturath-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");
  var state = document.getElementById("state");

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والخادمُ سليم تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    remember();
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  /* خادمُنا أجاب: نجاحٌ، أو جوابُ JSON منه غيرُ 5xx (خادمٌ أقدم لا يعرف /api/health
     يجيب 404 بـJSON). صفحاتُ أخطاء المنصّة HTML دائماً. */
  function answered(response) {
    if (response.ok) return true;
    var type = response.headers.get("content-type") || "";
    return response.status < 500 && type.indexOf("application/json") !== -1;
  }

  function describe() {
    if (navigator.onLine === false) {
      title.textContent = "انقطع الاتصال بالإنترنت";
      lead.textContent = "حين يعود الاتصال نفتح لك صفحة طلبك من تلقاء أنفسنا.";
      state.textContent = "بانتظار الشبكة";
      note.textContent = "";
    } else if (stuck()) {
      title.textContent = "الطبخة تأخذ وقتها";
      lead.textContent = "تحديث المتجر أطول من المعتاد قليلاً، والصفحة تعود إليك وحدها حين يجهز.";
      state.textContent = "على نارٍ هادئة";
      note.textContent = "نتفقّد المطبخ كل نصف دقيقة، ولك أن تعيد الطلب متى شئت.";
    } else {
      title.textContent = "المطبخ يتهيّأ لكم";
      lead.textContent = "نُحدّث المتجر الآن، وصفحة طلبك تعود إليك وحدها بعد قليل.";
      state.textContent = "على النار";
      note.textContent = "نُبقي القِدر على النار، ونفتح لك الصفحة التي طلبتها حين تجهز.";
    }
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(HEALTH, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(answered, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        if (ok) { reopen(); return; }
        describe();
        later();
      });
  }

  document.getElementById("retry").addEventListener("click", function () {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  });
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  describe();
  later();
})();
</script>
</body>
</html>
