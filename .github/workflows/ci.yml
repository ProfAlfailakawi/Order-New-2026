name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    # `npm ci || npm install` kept every run green while the lockfile was
    # unusable: npm ci refused it, the fallback resolved dependencies afresh,
    # and nobody saw a thing. A lockfile that is never enforced is not a
    # lockfile — builds stop being reproducible and the drift stays invisible.
    # The lockfile is repaired, so this can enforce it again.
    - name: Install dependencies
      run: npm ci

    - name: Run Typecheck
      run: npm run lint

    - name: Run Tests
      run: npx vitest run

    - name: Build
      run: npm run build
